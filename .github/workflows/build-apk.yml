
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'YouTubeScrollGuard_GitHub_Build_Ready.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q YouTubeScrollGuard_GitHub_Build_Ready.zip -d extracted
          test -f extracted/YouTubeScrollGuard/app/build.gradle.kts

      - name: Build APK
        run: gradle -p extracted/YouTubeScrollGuard :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeScrollGuard-debug-apk
          path: extracted/YouTubeScrollGuard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
