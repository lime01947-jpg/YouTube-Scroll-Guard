
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'YouTubeScrollGuard_GitHub_Build_Ready.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository root."
            ls -la
            exit 1
          fi
          echo "Found project: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/YouTubeScrollGuard/app/build.gradle.kts

      - name: Fix JVM target compatibility
        run: |
          sed -i '/defaultConfig {/i\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }' extracted/YouTubeScrollGuard/app/build.gradle.kts

          sed -i '/^android {/a\
              kotlinOptions {\
                  jvmTarget = "17"\
              }' extracted/YouTubeScrollGuard/app/build.gradle.kts

      - name: Build APK
        run: gradle -p extracted/YouTubeScrollGuard :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeScrollGuard-debug-apk
          path: extracted/YouTubeScrollGuard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
